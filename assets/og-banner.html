<!doctype html>
<!-- Fuente del banner para redes (1200×630) → src/web/public/og-banner.png
     Regenerar: msedge --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og-banner.png assets/og-banner.html -->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Etho Hub banner</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Public+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(ellipse at 88% 20%, #1C5E50 0%, #0F3F36 48%, #0A2C26 100%);
    color: #F3F1E8; font-family: 'Public Sans', Arial, sans-serif;
  }
  .rings { position: absolute; right: -120px; top: -140px; width: 760px; height: 760px; border-radius: 50%; border: 2px solid rgba(245,184,46,.18); }
  .rings::after { content: ""; position: absolute; inset: 130px; border-radius: 50%; border: 2px solid rgba(245,184,46,.14); }
  .copy { position: absolute; left: 72px; top: 64px; width: 540px; display: flex; flex-direction: column; height: 502px; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; }
  .logo { width: 48px; height: 48px; border-radius: 14px; background: #F5B82E; display: grid; place-items: center; }
  .eyebrow { margin-top: 56px; font-size: 16px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #F5B82E; }
  h1 { margin-top: 16px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 58px; line-height: 1.02; letter-spacing: -1px; }
  .cta { margin-top: auto; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; background: #F5B82E; color: #14201C; font-weight: 700; font-size: 22px; padding: 14px 26px; border-radius: 999px; }
  .art { position: absolute; left: 680px; top: 0; width: 560px; height: 630px; }
  .bubble { position: absolute; font-size: 18px; line-height: 1.3; padding: 12px 16px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 260px; }
  .in  { left: 640px; top: 130px; background: #FFFDF7; color: #14201C; border-bottom-left-radius: 4px; }
  .out { left: 656px; top: 212px; background: #D9F5E1; color: #0F3F36; border-bottom-left-radius: 4px; }
  .out small { display: block; font-size: 13px; font-weight: 700; letter-spacing: .5px; color: #1F8A4C; margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="rings"></div>

  <div class="copy">
    <div class="brand">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0F3F36" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
      </div>
      Etho Hub
    </div>
    <div class="eyebrow">Bots de WhatsApp con IA</div>
    <h1>Atiende a tus clientes por WhatsApp, incluso cuando no estás</h1>
    <div class="cta">7 días gratis · sin tarjeta</div>

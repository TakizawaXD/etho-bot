services:
  etho-bot:
    build: .
    container_name: etho-bot-hub
    restart: unless-stopped
    init: true                # cierra bien los procesos hijo (ffmpeg, yt-dlp)
    stop_grace_period: 30s    # tiempo para cerrar los bots de WhatsApp ordenadamente
    logging:
      driver: json-file
      options:
        max-size: "10m"        # evita que los logs llenen el disco
        max-file: "3"
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /app/data/bot.db
      SESSION_DIR: /app/data/sessions
    volumes:
      - ./data:/app/data

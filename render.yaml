services:
  - type: web
    name: etho-bot-hub
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /app/data/bot.db
      - key: SESSION_DIR
        value: /app/data/sessions
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TRANSFER_INSTRUCTIONS
        sync: false
      - key: MAX_ONLINE_BOTS
        value: "30"
    disk:
      name: etho-data
      mountPath: /app/data
      sizeGB: 2

